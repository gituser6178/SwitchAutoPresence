[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "switchautopresence"
version = "0.3.0a1"
description = "Unofficial Switch capture-card preview, local HOME recognition and Discord Rich Presence"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["opencv-python>=4.8,<5", "numpy>=1.24,<3"]

[project.optional-dependencies]
windows = ["pygrabber==0.2"]
viewer = ["windows-capture>=2.0.1,<3"]
discord = ["pypresence>=4.6,<5"]
auto = ["rapidocr>=3.10,<4", "onnxruntime>=1.17,<2"]
preview = ["Pillow>=10,<14"]
tray = ["pystray>=0.19.5,<1"]
audio = ["sounddevice>=0.5,<1"]
dev = ["pytest>=8,<10"]
all = [
    "pygrabber==0.2",
    "windows-capture>=2.0.1,<3",
    "pypresence>=4.6,<5",
    "rapidocr>=3.10,<4",
    "onnxruntime>=1.17,<2",
    "Pillow>=10,<14",
    "sounddevice>=0.5,<1",
    "pystray>=0.19.5,<1",
]

[project.scripts]
switchautopresence = "switchautopresence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
