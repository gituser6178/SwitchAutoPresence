[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "switchautopresence"
version = "0.2.0a1"
description = "Switch capture window recognition with manual Discord Rich Presence"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["opencv-python-headless>=4.8,<5", "numpy>=1.24,<3"]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
]

[project.optional-dependencies]
windows = ["pygrabber==0.2", "windows-capture>=2.0.1,<3"]
discord = ["pypresence>=4.6,<5"]
auto = ["rapidocr>=3.10,<4", "onnxruntime>=1.17,<2"]
dev = ["pytest>=8,<10"]
all = ["pygrabber==0.2", "windows-capture>=2.0.1,<3", "pypresence>=4.6,<5", "rapidocr>=3.10,<4", "onnxruntime>=1.17,<2"]

[project.scripts]
switchautopresence = "switchautopresence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
